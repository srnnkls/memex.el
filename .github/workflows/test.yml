name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version: ['29.1', '30.1']
        experimental: [false]
        include:
          - os: ubuntu-latest
            emacs-version: snapshot
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - uses: emacs-eask/setup-eask@master
        with:
          version: 'snapshot'

      - name: Install dependencies
        run: eask install-deps --dev

      - name: Compile
        run: eask compile

      - name: Test
        run: eask run script test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jcs090218/setup-emacs@master
        with:
          version: '30.1'

      - uses: emacs-eask/setup-eask@master
        with:
          version: 'snapshot'

      - name: Install dependencies
        run: eask install-deps --dev

      - name: Checkdoc
        run: eask lint checkdoc --strict

      - name: Package metadata
        run: |
          eask lint package --strict \
            $(ls memex*.el | grep -v -- '-tests\.el' \
                           | grep -vE 'memex-(embark|evil)\.el')

      # Unsilenceable `with-eval-after-load' warning: purcell/package-lint#125.
      - name: Package metadata (soft-dependency integrations)
        run: eask lint package memex-embark.el memex-evil.el

      - name: Declarations
        run: eask lint declare --strict

      - name: Regexps
        run: eask lint regexps --strict

      - name: Indentation
        run: eask lint indent
